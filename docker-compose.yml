services:
  armory:
    build: .
    container_name: armory
    restart: unless-stopped
    ports:
      - "4321:4321"
    volumes:
      - ./data:/data
    environment:
      - DB_PATH=/data/armory.db
      # Default password is "armory" — change this before exposing to your network
      - ARMORY_PASSWORD=${ARMORY_PASSWORD:-armory}
