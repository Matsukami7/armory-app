services:
  armory:
    image: ghcr.io/matsukami7/armory-app:latest
    # To build locally instead of pulling from GHCR:
    #   comment out the image line above and uncomment the build line below
    # build: .
    container_name: armory
    restart: unless-stopped
    ports:
      - "4321:4321"
    volumes:
      - ./data:/data
    environment:
      - DB_PATH=/data/armory.db
      # Default password is "changeme" — change this before exposing to your network
      - ARMORY_PASSWORD=${ARMORY_PASSWORD:-changeme}
